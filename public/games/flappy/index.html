<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sky Hopper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      cursor: pointer;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 320px;
      margin-bottom: 12px;
      font-family: monospace;
      font-size: 15px;
    }
    .hud span { color: #f59e0b; font-weight: bold; }
    canvas {
      background: #0c1b33;
      border: 2px solid #1e293b;
      border-radius: 8px;
    }
    .hint {
      margin-top: 12px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>BEST: <span id="best">0</span></div>
  </div>
  <canvas id="c" width="320" height="460"></canvas>
  <div class="hint">Click Screen or Press Space to Flap Wings</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');

    let birdY = 200, vel = 0, gravity = 0.35;
    let pipes = [];
    let score = 0;
    let best = parseInt(localStorage.getItem('unblock_flappy_hi') || '0', 10);
    let dead = false;
    let timer = 0;
    bestEl.innerText = best;

    function flap() {
      if (dead) {
        birdY = 200;
        vel = 0;
        pipes = [];
        score = 0;
        scoreEl.innerText = score;
        dead = false;
      } else {
        vel = -6;
      }
    }

    window.addEventListener('keydown', e => {
      if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); flap(); }
    });
    window.addEventListener('click', flap);

    function loop() {
      if (!dead) {
        vel += gravity;
        birdY += vel;

        timer++;
        if (timer > 90) {
          timer = 0;
          let gap = 110;
          let topH = Math.floor(Math.random() * (canvas.height - gap - 100)) + 40;
          pipes.push({ x: canvas.width, top: topH, bot: canvas.height - topH - gap, passed: false });
        }

        for (let i = pipes.length - 1; i >= 0; i--) {
          let p = pipes[i];
          p.x -= 2.2;

          if (!p.passed && p.x + 40 < 50) {
            p.passed = true;
            score++;
            scoreEl.innerText = score;
            if (score > best) {
              best = score;
              bestEl.innerText = best;
              localStorage.setItem('unblock_flappy_hi', best);
            }
          }

          // Collision
          if (50 + 10 > p.x && 50 - 10 < p.x + 40) {
            if (birdY - 10 < p.top || birdY + 10 > canvas.height - p.bot) {
              dead = true;
            }
          }

          if (p.x < -50) pipes.splice(i, 1);
        }

        if (birdY > canvas.height - 10 || birdY < 0) dead = true;
      }

      // Draw
      ctx.fillStyle = '#0c1b33';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Pipes
      pipes.forEach(p => {
        ctx.fillStyle = '#10b981';
        ctx.fillRect(p.x, 0, 40, p.top);
        ctx.fillRect(p.x, canvas.height - p.bot, 40, p.bot);
      });

      // Bird
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(50, birdY, 12, 0, Math.PI * 2);
      ctx.fill();

      if (dead) {
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 22px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = '14px sans-serif';
        ctx.fillText('Click to Try Again', canvas.width / 2, canvas.height / 2 + 20);
      }

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
