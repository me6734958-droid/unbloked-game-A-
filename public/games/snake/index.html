<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Retro Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 400px;
      margin-bottom: 12px;
      font-family: monospace;
      font-size: 16px;
    }
    .hud span { color: #10b981; font-weight: bold; }
    canvas {
      background: #050811;
      border: 2px solid #1e293b;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .hint {
      margin-top: 12px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>BEST: <span id="best">0</span></div>
  </div>
  <canvas id="c" width="400" height="400"></canvas>
  <div class="hint">Arrow Keys or WASD to Move · Space to Pause</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');

    const GRID = 20;
    const CELL = canvas.width / GRID;
    let snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
    let dir = {x: 0, y: -1};
    let nextDir = {x: 0, y: -1};
    let food = {x: 5, y: 5};
    let score = 0;
    let best = parseInt(localStorage.getItem('unblock_snake_hi') || '0', 10);
    let paused = false;
    bestEl.innerText = best;

    function spawnFood() {
      while (true) {
        food = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID)
        };
        if (!snake.some(s => s.x === food.x && s.y === food.y)) break;
      }
    }

    function reset() {
      snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
      dir = {x: 0, y: -1};
      nextDir = {x: 0, y: -1};
      score = 0;
      scoreEl.innerText = score;
      spawnFood();
    }

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
      if (e.key === ' ') { paused = !paused; return; }
      if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && dir.y === 0) nextDir = {x: 0, y: -1};
      if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') && dir.y === 0) nextDir = {x: 0, y: 1};
      if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && dir.x === 0) nextDir = {x: -1, y: 0};
      if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && dir.x === 0) nextDir = {x: 1, y: 0};
    });

    function loop() {
      if (!paused) {
        dir = nextDir;
        const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

        // Wall collision
        if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
          reset();
        } else if (snake.some(s => s.x === head.x && s.y === head.y)) {
          reset();
        } else {
          snake.unshift(head);
          if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreEl.innerText = score;
            if (score > best) {
              best = score;
              bestEl.innerText = best;
              localStorage.setItem('unblock_snake_hi', best);
            }
            spawnFood();
          } else {
            snake.pop();
          }
        }
      }

      // Draw
      ctx.fillStyle = '#050811';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Food
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Snake
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#10b981' : '#059669';
        ctx.beginPath();
        ctx.roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, i === 0 ? 5 : 2);
        ctx.fill();
      });

      if (paused) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = '20px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
      }
    }

    reset();
    setInterval(loop, 90);
  </script>
</body>
</html>
