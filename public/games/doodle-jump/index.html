<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doodle Hopper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 340px;
      margin-bottom: 12px;
      font-family: monospace;
      font-size: 15px;
    }
    .hud span { color: #10b981; font-weight: bold; }
    canvas {
      background: #070c18;
      border: 2px solid #1e293b;
      border-radius: 8px;
    }
    .hint {
      margin-top: 12px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>ALTITUDE: <span id="score">0</span></div>
    <div>BEST: <span id="best">0</span></div>
  </div>
  <canvas id="c" width="340" height="480"></canvas>
  <div class="hint">Left/Right Arrow Keys to Steer Jumper</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');

    let pX = 160, pY = 300, pVy = 0, gravity = 0.28;
    let platforms = [];
    let score = 0;
    let best = parseInt(localStorage.getItem('unblock_doodle_hi') || '0', 10);
    let keys = {};
    bestEl.innerText = best;

    function reset() {
      pX = 160; pY = 300; pVy = -8;
      platforms = [{ x: 140, y: 350, w: 60, h: 10 }];
      for (let i = 1; i < 7; i++) {
        platforms.push({
          x: Math.random() * (canvas.width - 60),
          y: 350 - i * 65,
          w: 55,
          h: 10
        });
      }
      score = 0;
      scoreEl.innerText = '0';
    }

    window.addEventListener('keydown', e => {
      if (['ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
      keys[e.key] = true;
    });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    function loop() {
      if (keys['ArrowLeft'] || keys['a']) pX -= 4.5;
      if (keys['ArrowRight'] || keys['d']) pX += 4.5;

      // Wrap around edges
      if (pX < -15) pX = canvas.width - 5;
      if (pX > canvas.width + 5) pX = -10;

      pVy += gravity;
      pY += pVy;

      // Platform bounce
      if (pVy > 0) {
        platforms.forEach(plat => {
          if (pX + 15 > plat.x && pX - 15 < plat.x + plat.w && pY + 15 >= plat.y && pY + 15 <= plat.y + plat.h + 8) {
            pVy = -8.5;
          }
        });
      }

      // Scroll camera when going up
      if (pY < 200) {
        let diff = 200 - pY;
        pY = 200;
        score += Math.round(diff);
        scoreEl.innerText = score;
        if (score > best) {
          best = score;
          bestEl.innerText = best;
          localStorage.setItem('unblock_doodle_hi', best);
        }

        platforms.forEach(plat => {
          plat.y += diff;
          if (plat.y > canvas.height) {
            plat.y = 0;
            plat.x = Math.random() * (canvas.width - 60);
          }
        });
      }

      // Fall off bottom
      if (pY > canvas.height) reset();

      // Render
      ctx.fillStyle = '#070c18';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Platforms
      ctx.fillStyle = '#10b981';
      platforms.forEach(plat => {
        ctx.beginPath();
        ctx.roundRect(plat.x, plat.y, plat.w, plat.h, 3);
        ctx.fill();
      });

      // Player
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(pX, pY, 14, 0, Math.PI * 2);
      ctx.fill();

      // Eyes
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(pX - 4, pY - 2, 2, 0, Math.PI * 2);
      ctx.arc(pX + 4, pY - 2, 2, 0, Math.PI * 2);
      ctx.fill();

      requestAnimationFrame(loop);
    }

    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
