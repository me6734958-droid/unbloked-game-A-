<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Retro Pong</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-around;
      width: 480px;
      margin-bottom: 12px;
      font-family: monospace;
      font-size: 16px;
    }
    .hud span { color: #10b981; font-weight: bold; }
    canvas {
      background: #050811;
      border: 2px solid #1e293b;
      border-radius: 8px;
    }
    .hint {
      margin-top: 12px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>YOU: <span id="pScore">0</span></div>
    <div>CPU BOT: <span id="cScore">0</span></div>
  </div>
  <canvas id="c" width="480" height="320"></canvas>
  <div class="hint">Use Up/Down Arrow Keys or Mouse to Move Paddle</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const pScoreEl = document.getElementById('pScore');
    const cScoreEl = document.getElementById('cScore');

    let pY = 120, cY = 120, padH = 60, padW = 10;
    let bX = 240, bY = 160, bDX = 4, bDY = 3, bR = 6;
    let pScore = 0, cScore = 0;

    canvas.addEventListener('mousemove', e => {
      let rect = canvas.getBoundingClientRect();
      pY = Math.max(0, Math.min(canvas.height - padH, e.clientY - rect.top - padH / 2));
    });

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp') pY = Math.max(0, pY - 20);
      if (e.key === 'ArrowDown') pY = Math.min(canvas.height - padH, pY + 20);
    });

    function reset() {
      bX = canvas.width / 2;
      bY = canvas.height / 2;
      bDX = (Math.random() > 0.5 ? 1 : -1) * 4;
      bDY = (Math.random() > 0.5 ? 1 : -1) * 3;
    }

    function loop() {
      bX += bDX;
      bY += bDY;

      // Top / bottom bounce
      if (bY - bR < 0 || bY + bR > canvas.height) bDY = -bDY;

      // Player paddle bounce
      if (bX - bR <= 20 && bX + bR >= 10 && bY >= pY && bY <= pY + padH) {
        bDX = Math.abs(bDX) * 1.05;
        let diff = (bY - (pY + padH / 2)) / (padH / 2);
        bDY = diff * 4;
      }

      // CPU Bot paddle bounce
      let cX = canvas.width - 20;
      if (bX + bR >= cX && bX - bR <= cX + padW && bY >= cY && bY <= cY + padH) {
        bDX = -Math.abs(bDX) * 1.05;
        let diff = (bY - (cY + padH / 2)) / (padH / 2);
        bDY = diff * 4;
      }

      // Simple CPU AI
      if (cY + padH / 2 < bY - 10) cY += 3.2;
      else if (cY + padH / 2 > bY + 10) cY -= 3.2;
      cY = Math.max(0, Math.min(canvas.height - padH, cY));

      // Scoring
      if (bX < 0) {
        cScore++;
        cScoreEl.innerText = cScore;
        reset();
      } else if (bX > canvas.width) {
        pScore++;
        pScoreEl.innerText = pScore;
        reset();
      }

      // Draw
      ctx.fillStyle = '#050811';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center divider
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Paddles
      ctx.fillStyle = '#10b981';
      ctx.fillRect(10, pY, padW, padH);

      ctx.fillStyle = '#ef4444';
      ctx.fillRect(canvas.width - 20, cY, padW, padH);

      // Ball
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(bX, bY, bR, 0, Math.PI * 2);
      ctx.fill();

      requestAnimationFrame(loop);
    }

    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
